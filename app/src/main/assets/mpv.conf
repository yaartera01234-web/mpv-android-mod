# ==========================================================
# 📱 MPV GPU-NEXT OPTIMIZED CONFIG (Smooth & Stable)
# ==========================================================

# 1. Next-Gen GPU Renderer
vo=gpu-next
hwdec=mediacodec            # Direct HW decoding (Zero lag / Low RAM usage)

# 2. Smooth Motion Sync
video-sync=display-resample
interpolation=yes

# 3. Motion Interpolation (Catmull-Rom)
tscale=catmull_rom
tscale-clamp=0.0

# 4. Lightweight Scaling
scale=bilinear
dscale=bilinear
cscale=bilinear

# 5. Buffer & Seeking Fix

hr-seek-framedrop=yes

# Badalna ho to: Settings -> Advanced -> Edit mpv.conf
