# ==========================================================
# MPV GPU-NEXT OPTIMIZED CONFIG (Smooth & Stable)
# ==========================================================
# Ye app ka default conf hai. Badalna ho to:
#   Settings -> Advanced -> Edit mpv.conf  (yahin file hai)
# ==========================================================

# 1. Next-Gen GPU Renderer
vo=gpu-next
hwdec=mediacodec

# 2. Smooth Motion Sync
video-sync=display-resample
interpolation=yes

# 3. Motion Interpolation (Catmull-Rom)
tscale=catmull_rom
tscale-clamp=0.0

# 4. Lightweight Scaling
scale=bilinear
dscale=bilinear
cscale=bilinear

# 5. Buffer & Seeking Fix
hr-seek-framedrop=yes
