name: Build APK (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Native libs (official release APK se)
        run: |
          curl -sL -o mpv.apk https://github.com/mpv-android/mpv-android/releases/download/2026-09-17/app-default-arm64-v8a-release.apk
          mkdir -p app/src/main/libs/arm64-v8a
          unzip -j -o mpv.apk 'lib/arm64-v8a/*' -d app/src/main/libs/arm64-v8a
          ls -la app/src/main/libs/arm64-v8a | head

      - name: Debug keystore (optional - update-install ke liye)
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            mkdir -p ~/.android
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
            echo "custom debug keystore set ✅"
          else
            echo "koi custom keystore nahi - GitHub ka apna debug key use hoga"
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDefaultDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mpv-arm64-apk
          path: app/build/outputs/apk/default/debug/app-default-arm64-v8a-debug.apk
          if-no-files-found: error
