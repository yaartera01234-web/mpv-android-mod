# ==========================================================
#  mpv.conf — tuned for mpv-android (is.xyz.mpv) on phone
#  Boss ka original conf, sirf 3 cheezein theek ki gayi hain:
#    1) gpu-api=vulkan  -> HATA diya (is app mein Vulkan hai hi nahi)
#    2) tscale-blur=0.5 -> RAKHA gaya (device pe tested: best smoothness + original look)
#    3) override-display-fps=60 -> HATA diya (app khud asli refresh rate deti hai)
#  Baqi sab jaisa tha waisa hai.
# ==========================================================

# ----------------------------------------------------------
#  GRAPHICS (phone ke liye best jo is app mein mumkin hai)
# ----------------------------------------------------------
vo=gpu-next
gpu-context=android

# NOTE: gpu-api=vulkan yahan kaam NAHI karta.
#   mpv-android libplacebo ko "-Dvulkan=disabled" se build karta hai
#   (buildscripts/scripts/libplacebo.sh), aur app ke libmpv.so mein
#   libvulkan ki dependency/koi Vulkan symbol mojood nahi.
#   Is liye API auto rehne do -> OpenGL (GLES) chalega. ✅

hwdec=mediacodec-copy
#   Sahi hai: zero-copy "mediacodec" sirf vo=gpu ke saath chalta hai.
#   gpu-next ke saath copy mode hi theek hai.

# ----------------------------------------------------------
#  MOTION / SMOOTHNESS (SVP jaisa)
# ----------------------------------------------------------
video-sync=display-resample
interpolation=yes

tscale=sphinx
tscale-radius=5.0
tscale-antiring=0.8
tscale-blur=0.5
#   Boss ne device pe test kiya: 0.5 pe "original look + smooth motion" -> BEST.
#   Kyun chalta hai: sphinx ka curve support ke andar non-negative smooth bump hai
#   (1.0 -> 0.0, koi bara overshoot nahi), aur blur kernel ko tang kar deta hai
#   (radius = blur x radius => 0.5 x 5.0 = 2.5 frames), is liye mix halka rehta hai
#   aur moving objects original ke qareeb lagte hain -- judder phir bhi khatam.
tscale-window=blackman

#   tscale=sphinx        -> valid hai (mpv ke tscale list mein maujood)
#   tscale-radius=5.0    -> valid (range 0.5 - 16). Bara radius = soft/zyada kaam.
#   tscale-antiring=0.8  -> valid (0.0-1.0). 0.8 tez hai; default 0.0,
#                           "high-quality" profile 0.6 rakhta hai.
#                           Image chikni/phasal lage to 0.6 kar dena.
#   tscale-blur=0.5
#   Boss ne device pe test kiya: 0.5 pe "original look + smooth motion" -> BEST.
#   Kyun chalta hai: sphinx ka curve support ke andar non-negative smooth bump hai
#   (1.0 -> 0.0, koi bara overshoot nahi), aur blur kernel ko tang kar deta hai
#   (radius = blur x radius => 0.5 x 5.0 = 2.5 frames), is liye mix halka rehta hai
#   aur moving objects original ke qareeb lagte hain -- judder phir bhi khatam.      -> 0.5 KAAM nahi karta: mpv docs kehti hain
#                           "too low (eg. 0.5) leads to bad results" -> 0.8-1.2 rakho.
#   tscale-window=blackman -> valid.

# ----------------------------------------------------------
#  DISPLAY SYNC
# ----------------------------------------------------------
# override-display-fps=60  -> HATA diya
#   (a) purana naam hai: naya "display-fps-override" hai
#   (b) app khud yeh value asli refresh rate pe set karti hai (MPVView.kt)
#   (c) 120Hz phone pe 60 maangna = smoothness aadhi. 24fps content 120Hz pe
#       5:1 clean pulldown ke saath behtar lagta hai.
#   Agar Android ghalat refresh rate de raha ho to sirf tab ye line lagao:
# display-fps-override=120

# video-timing-offset=0  -> HATA diya
#   mpv docs: ye sirf audio-timing modes (video-sync=audio) mein lagta hai.
#   display-resample ke saath ye bilkul use hi nahi hota -> bezarar.

# ----------------------------------------------------------
#  TROUBLESHOOTING (sirf zaroorat pare to)
# ----------------------------------------------------------
# hwdec-extra-frames=4      <- bara tscale radius + dropped frames dikhein to
# tscale=oversample         <- stutter/battery issue ho to (sab se halka, default)
# tscale-radius=3.0         <- GPU par zyada load ho to
