# ============================================================
#  mpv — SMOOTH / "60fps" BEST SETTINGS
#  Boss ka conf + net ki community best practice + apna test
#  Sab options mpv se verify kiye (parse + live status check)
#  Lagao: Settings > Advanced > Edit mpv.conf
# ============================================================

# ------------------------------------------------------------
#  1) CORE — ye do line har guide/thread mein hain
# ------------------------------------------------------------
video-sync=display-resample
#   video ko display ki refresh rate pe lock karta hai; audio halka
#   resample hota hai (pitch nahi badalta) taake fps vs Hz ka farq
#   (e.g. 23.976 vs 120Hz) khud theek ho jaye.

interpolation-preserve=yes
#   gpu-next pe interpolated frames ka cache bachata hai (docs: default on).

# ------------------------------------------------------------
#  2) TSCALE — "smooth look" banane wala filter (Boss ka tested combo)
# ------------------------------------------------------------
tscale=sphinx
tscale-radius=5.0
tscale-blur=0.5
tscale-antiring=0.8
tscale-window=blackman
#   0.5 blur = "original look + smooth motion" (Boss ne device pe test kiya)
#   radius 5 x blur 0.5 = asli window ~2.5 frames -> moving object smear nahi

# ---------- ALTERNATIVES (ek waqt mein sirf EK tscale) ----------
# S1) Community ka favourite — sab se sharp, "smoothmotion" (mpv default):
#     tscale=oversample
#
# S2) Mashhoor "SVP-jaisa magar soap-opera ke baghair" combo:
#     tscale=box
#     tscale-window=sphinx
#     tscale-radius=1.0
#     tscale-clamp=0.0
#
# S3) Sphinx ki calibrated tuning (iamscum guide):
#     tscale=sphinx
#     tscale-radius=1.0
#     tscale-blur=0.6991556596428412
#     tscale-clamp=0.0
#
# S4) Smooth (thora soap-opera feel):
#     tscale=mitchell

# ------------------------------------------------------------
#  3) SMART AUTO-INTERPOLATION
#     interpolation = sirf tab ON jab fps display Hz ka
#     saaf multiple NA ho. Warna OFF -> sab se sharp picture.
# ------------------------------------------------------------
#   Test kiye gaye nateeje (mpv 0.40 pe verify):
#     Display 120Hz : 24fps->OFF (5:1 clean) | 25fps->ON | 60fps->OFF (2:1)
#     Display  60Hz : 24fps->ON  (2.5:1)     | 25fps->ON | 60fps->OFF (1:1)
#   Matlab 60fps content pe interpolation kabhi nahi chalti (sahi hai —
#   wahan judder hota hi nahi) aur 120Hz pe 24fps bhi OFF (120/24 = 5 exact).
#
#   NOTE: profile ko file ke AAKHIR mein rakhna zaroori hai — profile ke
#   baad jo options likho ge wo usi profile ka hissa ban jayenge, root
#   option nahi rahenge. (Ye galti ek dafa pakdi gayi, ab theek hai.)

# ------------------------------------------------------------
#  ZAROORI BAATEIN (yaad rakho)
# ------------------------------------------------------------
# * mpv khud bhi 60fps ke liye handle karta hai: interpolation-threshold
#   (default 0.01) kehta hai abs(disphz/vfps - 1) < 0.01 to interpolation
#   band. Docs ka literal example: "60.00 FPS video + 59.94 Hz display =
#   interpolation never activated". Usay chhero mat.
# * hwdec-extra-frames ki zaroorat NAHI (hwdec=mediacodec-copy mein surfaces
#   foran release hote hain; "auto" kaafi hai — mpv source se verify).
# * Real 60fps (naye frames + motion vectors) mpv NAHI bana sakta — wo sirf
#   blend karta hai. Wo kaam SVP/VapourSynth/RIFE karte hain
#   -> tumhara RIFE notebook (PC/Colab) wala rasta.
# * Agar source khud 60fps hai to kuch karne ki zaroorat nahi — 120Hz pe
#   2:1 aur 60Hz pe 1:1 perfect ban jata hai.

# ============================================================
#  AUTO PROFILE  (file ke aakhir mein hona lazmi)
# ============================================================
[auto-interpolation]
profile-desc=interpolation sirf zaroorat pe (fps vs display Hz)
profile-cond=(function() local v = container_fps or estimated_vf_fps; local d = display_fps; if not v or not d or v <= 0 or d <= 0 then return false end local m = d / v; return math.abs(m - math.floor(m + 0.5)) > 0.02 end)()
profile-restore=copy
interpolation=yes
